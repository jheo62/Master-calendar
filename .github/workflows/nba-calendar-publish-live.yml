name: NBA Calendar Publish Live

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Escriba PUBLICAR para autorizar la publicación'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nba-calendar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04

    steps:
      - name: Verify authorization
        shell: bash
        run: |
          if [ "${{ inputs.confirm_publish }}" != "PUBLICAR" ]; then
            echo "ERROR: publicación no autorizada."
            exit 1
          fi
          echo "AUTORIZACION: OK"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Verify production branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "ERROR: solo se permite publicar desde main."
            exit 1
          fi
          echo "RAMA PRODUCCION: main"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run engine self-test
        run: python3 tools/self_test_engine.py

      - name: Check current master against published state
        run: |
          python3 tools/update_engine.py \
            --candidate data/master_snapshot.json \
            --state data/published_state.json \
            --report "$RUNNER_TEMP/nba_update_report.json" \
            --docs docs

      - name: Validate calendar feeds
        run: python3 tools/validate_feeds.py

      - name: Prepare NBA observation workspace
        run: |
          rm -rf "$RUNNER_TEMP/nba-live"
          mkdir -p "$RUNNER_TEMP/nba-live/html"

      - name: Download official NBA schedule pages
        run: |
          python3 tools/download_nba_source.py \
            --teams data/reference/nba_teams_2026_27.tsv \
            --output-dir "$RUNNER_TEMP/nba-live/html" \
            --timeout 30

      - name: Extract official NBA schedule
        run: |
          python3 tools/extract_nba_source.py \
            --html-dir "$RUNNER_TEMP/nba-live/html" \
            --teams data/reference/nba_teams_2026_27.tsv \
            --output "$RUNNER_TEMP/nba-live/nba_source.json"

      - name: Adapt official NBA source
        run: |
          python3 tools/source_adapter.py \
            --source "$RUNNER_TEMP/nba-live/nba_source.json" \
            --master data/master_snapshot.json \
            --identity-map data/nba_game_identity_map.json \
            --arena-registry data/reference/arena_registry.json \
            --output "$RUNNER_TEMP/nba-live/nba_candidate.json"

      - name: Validate source contract
        run: |
          python3 tools/source_contract.py \
            "$RUNNER_TEMP/nba-live/nba_candidate.json"

      - name: Run ingestion guard
        run: |
          python3 tools/ingestion_guard.py \
            data/master_snapshot.json \
            "$RUNNER_TEMP/nba-live/nba_candidate.json"

      - name: Generate live state differential report
        run: |
          python3 tools/change_report.py \
            --candidate "$RUNNER_TEMP/nba-live/nba_candidate.json" \
            --state data/published_state.json \
            --output "$RUNNER_TEMP/nba-live/state_change_report.json"

      - name: Live publication safety gate
        shell: bash
        run: |
          python3 -c 'import json,sys; from pathlib import Path; r=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); c=r["counts"]; a=c["added"]; m=c["modified"]; x=c["missing"]; t=a+m; print("Added:",a); print("Modified:",m); print("Missing:",x); print("Publishable changes:",t); x == 0 or sys.exit("ERROR: existen eventos ausentes. Revisión manual obligatoria."); t <= 20 or sys.exit("ERROR: más de 20 cambios detectados. Revisión manual obligatoria."); print("SAFETY GATE: OK")' "$RUNNER_TEMP/nba-live/state_change_report.json"

      - name: Generate detailed live change report
        run: |
          python3 tools/detailed_change_report.py \
            --baseline data/master_snapshot.json \
            --candidate "$RUNNER_TEMP/nba-live/nba_candidate.json" \
            --output "$RUNNER_TEMP/nba-live/detailed_change_report.json"

      - name: Classify live changes
        run: |
          python3 tools/change_decision.py \
            --report "$RUNNER_TEMP/nba-live/detailed_change_report.json" \
            --policy data/reference/change_decision_policy.json \
            --output "$RUNNER_TEMP/nba-live/change_decision.json"

      - name: Validate live arena geography
        run: |
          python3 tools/arena_geography_guard.py \
            --candidate "$RUNNER_TEMP/nba-live/nba_candidate.json" \
            --report "$RUNNER_TEMP/nba-live/detailed_change_report.json" \
            --registry data/reference/arena_registry.json \
            --output "$RUNNER_TEMP/nba-live/arena_guard.json"

      - name: Validate live temporal changes
        run: |
          python3 tools/temporal_guard.py \
            --report "$RUNNER_TEMP/nba-live/detailed_change_report.json" \
            --output "$RUNNER_TEMP/nba-live/temporal_guard.json"

      - name: Evaluate live promotion gate
        run: |
          python3 tools/promotion_gate.py \
            --change-decision "$RUNNER_TEMP/nba-live/change_decision.json" \
            --arena-guard "$RUNNER_TEMP/nba-live/arena_guard.json" \
            --temporal-guard "$RUNNER_TEMP/nba-live/temporal_guard.json" \
            --output "$RUNNER_TEMP/nba-live/promotion_gate.json"

      - name: Determine publishable change count
        id: changes
        shell: bash
        run: |
          COUNT=$(python3 -c 'import json,sys; c=json.load(open(sys.argv[1],encoding="utf-8"))["counts"]; print(c["added"] + c["modified"])' "$RUNNER_TEMP/nba-live/state_change_report.json")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No existen cambios publicables."
          else
            echo "Cambios publicables: $COUNT"
          fi

      - name: Apply validated live update
        if: steps.changes.outputs.count != '0'
        run: |
          python3 tools/update_engine.py \
            --candidate "$RUNNER_TEMP/nba-live/nba_candidate.json" \
            --state data/published_state.json \
            --report "$RUNNER_TEMP/nba-live/apply_report.json" \
            --docs docs \
            --apply

      - name: Promote live candidate to master snapshot
        if: steps.changes.outputs.count != '0'
        run: cp "$RUNNER_TEMP/nba-live/nba_candidate.json" data/master_snapshot.json

      - name: Validate regenerated production feeds
        if: steps.changes.outputs.count != '0'
        run: python3 tools/validate_feeds.py

      - name: Verify post-publication state
        if: steps.changes.outputs.count != '0'
        shell: bash
        run: |
          python3 tools/change_report.py \
            --candidate data/master_snapshot.json \
            --state data/published_state.json \
            --output "$RUNNER_TEMP/nba-live/post_publish_report.json"
          python3 -c 'import json,sys; c=json.load(open(sys.argv[1],encoding="utf-8"))["counts"]; print("POST-PUBLISH:",c); assert c["added"]==0 and c["modified"]==0 and c["missing"]==0, "ERROR: post-publicación no converge a 0/0/0"; print("POST-PUBLISH STATE: CLEAN")' "$RUNNER_TEMP/nba-live/post_publish_report.json"

      - name: Commit and push validated live update
        if: steps.changes.outputs.count != '0'
        shell: bash
        run: |
          git config user.name "NBA Master Calendar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data/master_snapshot.json data/published_state.json
          if git diff --cached --quiet; then
            echo "No tracked publication changes to commit."
            exit 0
          fi
          git commit -m "Actualizar calendarios NBA 2026-27 desde fuente oficial"
          git push origin HEAD:main
