name: NBA Calendar Publish XLSX — DISABLED

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Ruta bloqueada: ningún valor autoriza publicación'
        required: false
        type: string

permissions: {}

jobs:
  publication_blocked:
    runs-on: ubuntu-26.04
    steps:
      - name: Refuse XLSX publication
        shell: bash
        run: |
          printf '%s\n' 'BLOCKED: Publish XLSX requires a separately authorized publication procedure.'
          exit 1
