name: NBA Calendar Publish XLSX

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Escriba PUBLICAR para autorizar la publicación'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nba-calendar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Verify authorization
        shell: bash
        run: |
          if [ "${{ inputs.confirm_publish }}" != "PUBLICAR" ]; then
            echo "ERROR: publicación no autorizada."
            exit 1
          fi
          echo "AUTORIZACION: OK"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "ERROR: solo se permite publicar desde main."
            exit 1
          fi
          echo "RAMA PRODUCCION: main"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Run engine self-test
        run: python tools/self_test_engine.py

      - name: Run change-report self-test
        run: python tools/self_test_change_report.py

      - name: Rebuild candidate snapshot from XLSX
        run: |
          python tools/build_master_snapshot.py \
            --xlsx source/NBA_Master_Calendar_2026-27_Base_Maestra_2.4_VALIDADA.xlsx \
            --output /tmp/master_snapshot_candidate.json

      - name: Generate differential report
        run: |
          python tools/change_report.py \
            --candidate /tmp/master_snapshot_candidate.json \
            --state data/published_state.json \
            --output /tmp/nba_change_report.json

      - name: Safety gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/nba_change_report.json").read_text(encoding="utf-8")
          )

          counts = report["counts"]

          added = counts["added"]
          modified = counts["modified"]
          missing = counts["missing"]
          total_changes = added + modified

          print("Added:", added)
          print("Modified:", modified)
          print("Missing:", missing)
          print("Publishable changes:", total_changes)

          if missing != 0:
              raise SystemExit(
                  "ERROR: existen eventos ausentes. Revisión manual obligatoria."
              )

          if total_changes > 20:
              raise SystemExit(
                  "ERROR: más de 20 cambios detectados. Revisión manual obligatoria."
              )

          print("SAFETY GATE: OK")
          PY

      - name: Generate detailed promotion report
        run: |
          python tools/detailed_change_report.py \
            --baseline data/master_snapshot.json \
            --candidate /tmp/master_snapshot_candidate.json \
            --output /tmp/nba_promotion_detailed_report.json

      - name: Classify candidate changes for promotion
        run: |
          python tools/change_decision.py \
            --report /tmp/nba_promotion_detailed_report.json \
            --policy data/reference/change_decision_policy.json \
            --output /tmp/nba_promotion_decision.json

      - name: Validate arena geography
        run: |
          python3 tools/arena_geography_guard.py \
            --candidate /tmp/master_snapshot_candidate.json \
            --report /tmp/nba_promotion_detailed_report.json \
            --registry data/reference/arena_registry.json \
            --output /tmp/nba_arena_geography_guard.json

      - name: Validate temporal changes
        run: |
          python3 tools/temporal_guard.py \
            --report /tmp/nba_promotion_detailed_report.json \
            --output /tmp/nba_temporal_guard.json

      - name: Promotion gate
        run: |
          python3 tools/promotion_gate.py \
            --change-decision /tmp/nba_promotion_decision.json \
            --arena-guard /tmp/nba_arena_geography_guard.json \
            --temporal-guard /tmp/nba_temporal_guard.json \
            --output /tmp/nba_promotion_gate.json

      - name: Stop cleanly when there are no changes
        id: changes
        shell: bash
        run: |
          COUNT=$(python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/nba_change_report.json").read_text(encoding="utf-8")
          )

          c = report["counts"]
          print(c["added"] + c["modified"])
          PY
          )

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No existen cambios publicables."
          else
            echo "Cambios publicables: $COUNT"
          fi

      - name: Apply validated update
        if: steps.changes.outputs.count != '0'
        run: |
          python tools/update_engine.py \
            --candidate /tmp/master_snapshot_candidate.json \
            --state data/published_state.json \
            --report /tmp/nba_apply_report.json \
            --docs docs \
            --apply

      - name: Promote candidate to master snapshot
        if: steps.changes.outputs.count != '0'
        run: |
          cp /tmp/master_snapshot_candidate.json \
             data/master_snapshot.json

      - name: Validate regenerated feeds
        if: steps.changes.outputs.count != '0'
        run: python tools/validate_feeds.py

      - name: Verify production state after apply
        if: steps.changes.outputs.count != '0'
        run: |
          python tools/change_report.py \
            --candidate data/master_snapshot.json \
            --state data/published_state.json \
            --output /tmp/post_publish_report.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/post_publish_report.json").read_text(encoding="utf-8")
          )

          counts = report["counts"]

          print(counts)

          if counts["added"] != 0:
              raise SystemExit("ERROR post-publicación: added != 0")

          if counts["modified"] != 0:
              raise SystemExit("ERROR post-publicación: modified != 0")

          if counts["missing"] != 0:
              raise SystemExit("ERROR post-publicación: missing != 0")

          print("POST-PUBLISH STATE: CLEAN")
          PY

      - name: Commit and push validated update
        if: steps.changes.outputs.count != '0'
        shell: bash
        run: |
          git config user.name "NBA Master Calendar Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            docs \
            data/master_snapshot.json \
            data/published_state.json

          if git diff --cached --quiet; then
            echo "No tracked publication changes to commit."
            exit 0
          fi

          git commit -m "Actualizar calendarios NBA 2026-27"
          git push origin HEAD:main
